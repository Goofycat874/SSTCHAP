<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inside the Vidhan Sabha</title>
<meta name="description" content="Interactive civics chapter: State Legislature, the three lists, Union vs State government, and challenges to legislatures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400&display=swap">
<style>
/* Layout: cinematic editorial. Full-bleed dark hero and bands, a 1120px editorial column, hairline dividers, sharp corners. One accent: Rosso Corsa. */
:root {
  color-scheme: dark;
  --bg: #181818;
  --surface-2: #202020;
  --surface: #303030;
  --fg: #ffffff;
  --fg-2: #969696;
  --muted: #666666;
  --line: #303030;
  --line-strong: #4a4a4a;
  --red: #da291c;
  --red-active: #b01e0a;
  --success: #03904a;
  --warn: #f13a2c;
  --info: #4c98b9;
  --ok-bg: rgba(3, 144, 74, 0.14);
  --no-bg: rgba(241, 58, 44, 0.12);
  --union: #4c98b9;
  --state: #03904a;
  --conc: #d2d2d2;
  --conc-ink: #ffffff;
  --upper: #da291c;
  --brass: #969696;
  --seat-on: #ffffff;
  --seat-dim: #4a4a4a;
  --seat-off: #262626;
  --f: "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --f-deva: "Noto Sans Devanagari", "Inter", sans-serif;
  --f-display: var(--f);
  --f-body: var(--f);
  --f-mono: var(--f);
  --xxxs: 4px; --xxs: 8px; --xs: 16px; --sm: 24px; --md: 32px; --lg: 48px; --xl: 64px; --xxl: 96px; --super: 128px;
}
/* White editorial band: re-points the tokens so every component inside reads dark-on-white. */
.light {
  --bg: #ffffff; --surface-2: #f7f7f7; --surface: #ebebeb;
  --fg: #181818; --fg-2: #666666; --muted: #8f8f8f;
  --line: #d2d2d2; --line-strong: #b4b4b4;
  --ok-bg: rgba(3, 144, 74, 0.1); --no-bg: rgba(241, 58, 44, 0.08);
  --union: #2f7697; --state: #03904a;
  color-scheme: light;
  background: var(--bg); color: var(--fg);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition-duration: 0.01ms !important; animation: none !important; } }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--f); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--f); font-weight: 500; line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
strong, b { font-weight: 600; color: var(--fg); }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid #f6e500; outline-offset: 2px; }
.mono { font-family: var(--f); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.small { font-size: 0.8125rem; }
.muted { color: var(--fg-2); }
.tnum { font-variant-numeric: tabular-nums; }
.ok-t { color: var(--success); }
.no-t { color: var(--warn); }
.rev-t { color: var(--fg); }
.eyebrow, .cap-up { font: 600 11px/1.4 var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.cap { color: var(--fg-2); text-align: center; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1.4 var(--f); text-transform: uppercase; letter-spacing: 1.1px; background: var(--surface); color: var(--fg); padding: 4px 12px; border-radius: 9999px; }

/* ---------- top nav ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1280px; margin: 0 auto; padding: 0 var(--xs); min-height: 64px; display: grid; grid-template-columns: auto 1fr auto; gap: var(--sm); align-items: center; }
.brand-btn { background: none; border: 0; padding: 0; }
.brand { display: inline-flex; align-items: center; gap: 12px; }
.brand-mark { display: inline-grid; place-items: center; width: 32px; height: 32px; background: var(--red); }
.brand-t { font: 500 15px/1 var(--f); letter-spacing: -0.1px; white-space: nowrap; }
.modes { display: flex; gap: var(--xxs); justify-content: center; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.modes::-webkit-scrollbar { display: none; }
.mode-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 0 12px; min-height: 48px; font: 600 13px/1.4 var(--f); text-transform: uppercase; letter-spacing: 0.65px; color: var(--fg-2); white-space: nowrap; }
.mode-btn:hover { color: var(--fg); }
.mode-btn > svg, .mode-btn > span:not(.mode-pill) { position: relative; z-index: 1; }
.mode-btn.on { color: var(--fg); }
.mode-pill { position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--red); z-index: 0; }
.hud { display: inline-flex; align-items: center; gap: var(--xs); border: 1px solid var(--line-strong); background: transparent; padding: 0 0 0 14px; height: 40px; }
.hud-xp { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--f); font-variant-numeric: tabular-nums; color: var(--fg); }
.hud-xp svg { color: var(--fg-2); }
.hud-xp small { font: 600 11px var(--f); letter-spacing: 1.1px; color: var(--fg-2); }
.hud-streak { display: inline-flex; align-items: center; gap: 4px; font: 600 14px var(--f); color: var(--red); font-variant-numeric: tabular-nums; }
.hud-ring { position: relative; display: inline-grid; place-items: center; width: 40px; height: 38px; border-left: 1px solid var(--line-strong); }
.hud-pct { position: absolute; font-size: 9px; font-weight: 600; }
.topline { height: 2px; }
.topline-fill { height: 100%; background: var(--fg); }

@media (max-width: 860px) {
  .topbar-in { grid-template-columns: 1fr auto; gap: var(--xxs) var(--xs); padding-top: 8px; min-height: 0; }
  .modes { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; margin: 0 calc(-1 * var(--xs)); padding: 0 var(--xs); border-top: 1px solid var(--line); }
  .mode-btn { min-height: 44px; padding: 0 10px; }
  .mode-pill { left: 10px; right: 10px; }
}
@media (max-width: 420px) { .brand-t { font-size: 14px; } .hud { gap: 10px; padding-left: 10px; } }

/* ---------- page frame ---------- */
.main { padding-block: 0 var(--xl); overflow-x: clip; }
.mode { padding-inline: var(--xs); }
.learn { display: block; }
.learn-main { max-width: 1120px; margin: 0 auto; padding-inline: var(--xs); }
.foot { border-top: 1px solid var(--line); max-width: 1280px; margin: 0 auto; padding: var(--md) var(--xs) var(--lg); }

/* ---------- hero: cinematic band ---------- */
.hero { position: relative; overflow: hidden; display: flex; align-items: flex-end; min-height: clamp(520px, 74vh, 760px); background: radial-gradient(120% 90% at 78% 100%, #3c3c3c 0%, #181818 55%, #101010 100%); border-bottom: 1px solid var(--line); }
.hero-art { position: absolute; right: -12%; bottom: -2%; width: min(1240px, 125vw); opacity: 0.9; }
.hero-art .hemi { max-width: none !important; width: 100%; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,16,16,.92) 0%, rgba(16,16,16,.55) 45%, rgba(16,16,16,0) 75%), linear-gradient(0deg, rgba(16,16,16,.95) 0%, rgba(16,16,16,0) 55%); }
.hero-text { position: relative; width: 100%; max-width: 1120px; margin: 0 auto; padding: var(--super) var(--xs) var(--xl); display: flex; flex-direction: column; gap: var(--sm); align-items: flex-start; }
.hero h1 { font-size: clamp(40px, 7.4vw, 80px); font-weight: 500; line-height: 1.05; letter-spacing: -1.6px; max-width: 12ch; }
.lead { font-size: 18px; line-height: 1.55; color: var(--fg-2); max-width: 46ch; }
.cta-row { display: flex; flex-wrap: wrap; gap: var(--xs); }
.deva { font-family: var(--f-deva); color: var(--muted); font-size: 15px; letter-spacing: 0.5px; }
.hemi { width: 100%; height: auto; display: block; }
@media (max-width: 640px) {
  .hero { min-height: 560px; }
  .hero-art { right: -30%; bottom: auto; top: 4%; width: 150vw; opacity: 0.6; }
  .hero-shade { background: linear-gradient(0deg, rgba(16,16,16,1) 30%, rgba(16,16,16,.3) 100%); }
  .hero-text { padding-top: 220px; padding-bottom: var(--lg); }
}

/* ---------- chapter list (race-calendar rows) ---------- */
.cal { margin: var(--xl) 0 var(--lg); border-top: 1px solid var(--fg); }
.cal-head { display: flex; justify-content: space-between; padding: var(--xs) 0; border-bottom: 1px solid var(--line); }
.cal-row { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--xs); align-items: center; padding: var(--xs) 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: background .15s; }
.cal-row:hover { background: var(--surface-2); }
.cal-n { font: 500 22px var(--f); color: var(--fg-2); padding-left: var(--xxs); }
.cal-t { font: 500 18px/1.3 var(--f); display: flex; flex-direction: column; min-width: 0; }
.cal-t small { font: 400 13px/1.5 var(--f); color: var(--fg-2); }
.cal-s { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); padding-right: var(--xxs); }
.cal-row.done .cal-s { color: var(--success); }
.cal-row.done .cal-n { color: var(--fg); }
@media (min-width: 900px) { .cal-row { grid-template-columns: 80px 1fr auto; } .cal-t { flex-direction: row; align-items: baseline; gap: var(--sm); } }

/* ---------- hook ---------- */
.hook { padding: var(--xl) 0; border-top: 1px solid var(--line); }
.hook .eyebrow { color: var(--red); }
.hook h2 { font-size: clamp(30px, 5vw, 56px); letter-spacing: -1.12px; line-height: 1.1; margin: var(--xxs) 0 var(--xs); max-width: 16ch; }
.hook-intro p:last-child { color: var(--fg-2); max-width: 56ch; font-size: 17px; }
.files { display: grid; gap: 1px; margin-top: var(--lg); background: var(--line); border: 1px solid var(--line); }
@media (min-width: 900px) { .files { grid-template-columns: repeat(3, 1fr); } }
.file { position: relative; background: var(--bg); padding: var(--sm); display: flex; flex-direction: column; gap: var(--xs); min-width: 0; border-top: 2px solid transparent; }
.file-ok { border-top-color: var(--success); }
.file-no { border-top-color: var(--warn); }
.file-tab { font: 600 11px var(--f); letter-spacing: 1.1px; color: var(--fg-2); }
.file-title { display: flex; align-items: flex-start; gap: 10px; font: 500 22px/1.3 var(--f); letter-spacing: -0.2px; }
.file-title svg { flex-shrink: 0; margin-top: 4px; color: var(--fg-2); }
.file-choices { display: flex; flex-direction: column; gap: var(--xxs); margin-top: auto; }
.fc { border: 1px solid var(--line-strong); background: transparent; padding: 12px 14px; text-align: left; font: 500 14px var(--f); transition: border-color .15s, background .15s; }
.fc:not(:disabled):hover { border-color: var(--fg); }
.fc.answer { border-color: var(--success); background: var(--ok-bg); }
.fc.picked:not(.answer) { border-color: var(--warn); background: var(--no-bg); }
.fc:disabled:not(.picked):not(.answer) { opacity: 0.4; }
.file-why { overflow: hidden; display: flex; flex-direction: column; gap: var(--xxs); }
.file-why p { font-size: 15px; color: var(--fg-2); }
.hook-out { margin-top: var(--md); display: flex; flex-direction: column; gap: var(--xs); align-items: flex-start; }
.hook-out p { max-width: 60ch; color: var(--fg-2); }
.hook-out .mono { color: var(--fg); font-weight: 600; }

/* ---------- watch ---------- */
.watch { padding: var(--xl) 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--sm); }
.watch-head h2 { font-size: clamp(28px, 4.4vw, 56px); letter-spacing: -1.12px; margin: var(--xxs) 0; }
.watch-head .eyebrow { color: var(--fg); }
.recap-video { max-width: 1120px; margin: var(--lg) auto 0; padding-inline: var(--xs); }
.watch-compact { border-top: 0; padding-top: 0; }

/* ---------- section ---------- */
.sec { padding-block: var(--xxl) var(--lg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--md); }
.sec-head { display: grid; grid-template-columns: 1fr; gap: var(--xxs); }
.sec-num { font: 500 13px var(--f); letter-spacing: 1.1px; color: var(--red); order: -1; }
.sec-titles { display: flex; flex-direction: column; gap: var(--xxs); }
.sec-titles .eyebrow { order: -1; }
.sec-titles h2 { font-size: clamp(32px, 5.4vw, 56px); letter-spacing: -1.12px; line-height: 1.08; }
.done-chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--success); border: 1px solid var(--success); padding: 4px 12px; border-radius: 9999px; }
.prose-lead { font-size: 18px; line-height: 1.6; color: var(--fg-2); max-width: 62ch; }
.prose-lead strong { color: var(--fg); }
.two-up { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 760px) { .two-up { grid-template-columns: 1fr 1fr; } }
.pillar { background: var(--bg); padding: var(--sm); display: flex; flex-direction: column; gap: var(--xs); min-width: 0; color: var(--fg-2); }
.pillar-h { display: flex; align-items: center; gap: 10px; font: 500 26px/1.3 var(--f); color: var(--fg); letter-spacing: 0.2px; }
.pillar-h svg { color: var(--fg-2); }
.tok { display: inline-block; padding: 0 8px; font-weight: 600; font-size: 0.92em; border: 1px solid currentColor; }
.tok-union { color: var(--union); }
.tok-state { color: var(--state); }
.tok-conc { color: var(--conc); }

.card { background: var(--surface-2); border: 1px solid var(--line); padding: var(--sm); display: flex; flex-direction: column; gap: var(--sm); min-width: 0; }
@media (min-width: 640px) { .card { padding: var(--md); } }
.card.light { border-color: #ebebeb; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: var(--xs); border-bottom: 1px solid var(--line); }
.card-head svg { color: var(--fg-2); align-self: center; }
.card-head h3 { font-size: 26px; font-weight: 500; letter-spacing: 0.2px; }
.card-hint { margin-left: auto; font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); font-variant-numeric: tabular-nums; }

.callout { border-left: 2px solid var(--fg); padding: 4px 0 4px var(--sm); display: flex; flex-direction: column; gap: var(--xxs); max-width: 70ch; color: var(--fg-2); font-size: 17px; }
.callout-conc { border-color: var(--conc); }
.callout-h { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg); }

.key-idea { display: grid; gap: var(--xs); padding: var(--md) 0; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--line); font: 500 clamp(20px, 2.6vw, 26px)/1.5 var(--f); letter-spacing: 0.1px; color: var(--fg-2); }
.key-idea strong { color: var(--fg); font-weight: 500; }
.key-idea .tok { font-weight: 500; }
.key-tag { display: inline-flex; gap: 8px; align-items: center; font: 600 11px var(--f); letter-spacing: 1.1px; color: var(--red); }

.extra { display: flex; flex-wrap: wrap; gap: var(--xs); align-items: baseline; padding: var(--xs) 0; border-top: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); font-size: 14px; color: var(--fg-2); }
.extra-tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--info); border: 1px solid var(--info); padding: 2px 10px; border-radius: 9999px; white-space: nowrap; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 0; background: var(--red); color: #fff; min-height: 48px; padding: 14px 32px; font: 700 14px/1 var(--f); text-transform: uppercase; letter-spacing: 1.4px; text-decoration: none; }
.btn:active { background: var(--red-active); }
.btn:disabled { opacity: 0.35; }
.btn.big { min-height: 56px; padding: 18px 36px; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--fg); background: transparent; color: var(--fg); min-height: 48px; padding: 14px 28px; font: 700 13px/1 var(--f); text-transform: uppercase; letter-spacing: 1.4px; text-decoration: none; align-self: flex-start; }
.btn-ghost:active { background: var(--surface); }
.btn-ghost.sm { min-height: 36px; padding: 10px 16px; font-size: 11px; letter-spacing: 1.1px; }
.btn-ghost.ok { border-color: var(--success); color: var(--success); }
.btn-ghost.no { border-color: var(--warn); color: var(--warn); }
.btn-ghost.rev { border-color: var(--fg-2); color: var(--fg); }
.icon-btn { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line-strong); background: transparent; }
.icon-btn.sm { width: 32px; height: 32px; font-size: 14px; }
.icon-btn:disabled { opacity: 0.3; }
.chip-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 0; margin-right: var(--sm); font: 600 12px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
.chip-btn:hover { color: var(--fg); }
.chip-btn.on { color: var(--fg); border-bottom-color: var(--red); }
.pill-row { display: flex; flex-wrap: wrap; gap: var(--xxs); }
.pill-row.center { justify-content: center; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 9999px; font: 600 11px/1.4 var(--f); text-transform: uppercase; letter-spacing: 1.1px; background: var(--surface); color: var(--fg); border-left: 3px solid var(--c); }
.list-badge { display: inline-block; align-self: flex-start; font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; padding: 4px 12px; border-radius: 9999px; border: 1px solid var(--c); color: var(--c); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 0 var(--sm); align-self: flex-start; border-bottom: 1px solid var(--line); }
.seg button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; padding: 10px 0; font: 600 12px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
.seg button:hover { color: var(--fg); }
.seg button.on { color: var(--fg); border-bottom-color: var(--red); }
.seg-wide { align-self: stretch; display: flex; }
.tabs-scroll { overflow-x: auto; margin-inline: calc(-1 * var(--xs)); padding-inline: var(--xs); }
.seg-scroll { flex-wrap: nowrap; }
.seg-scroll button { white-space: nowrap; }
.field { width: 100%; border: 1px solid var(--line-strong); background: var(--bg); border-radius: 4px; min-height: 48px; padding: 14px 16px; font: 400 15px var(--f); color: var(--fg); }
.field:focus { border-color: var(--fg); outline: none; }

/* ---------- explain ---------- */
.explain { display: flex; flex-direction: column; gap: var(--xs); }
.explain-btns { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.explain-btns .chip-btn { margin-bottom: -1px; }
.explain-body { padding: var(--xs) 0 var(--xs) var(--sm); border-left: 2px solid var(--red); color: var(--fg-2); max-width: 70ch; }
.power-bars { display: flex; flex-direction: column; gap: var(--xs); }
.pb-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 500; color: var(--fg); }
.pb-track, .meter-track { height: 4px; background: var(--line); overflow: hidden; }
.pb-fill, .meter-fill { height: 100%; background: var(--fg); }
.meter-fill.mid { background: var(--fg-2); }
.meter-fill.low { background: var(--red); }
.meter-track.big { height: 4px; width: 100%; }
.twin-vis { display: flex; flex-direction: column; gap: var(--xxs); }
.tv-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--xs); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tv-u { color: var(--fg); text-align: right; font-weight: 500; }
.tv-s { color: var(--fg); font-weight: 500; }
.tv-arrow { color: var(--fg-2); }
.tv-n { grid-column: 1 / -1; text-align: center; margin-top: -4px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: var(--xxs); }
.chain-node { border: 1px solid var(--line-strong); padding: 8px 12px; font-weight: 500; font-size: 14px; color: var(--fg); }
.chain-node:last-child { border-color: var(--red); }
.chain-arrow { color: var(--fg-2); }

/* ---------- quiz ---------- */
.quiz-block { border-top: 1px solid var(--fg); padding-top: var(--sm); display: flex; flex-direction: column; gap: var(--md); }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.quiz-head .eyebrow { color: var(--fg); }
.quiz-head .mono { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
.q { display: flex; flex-direction: column; gap: var(--xs); }
.q-text { font: 500 20px/1.4 var(--f); letter-spacing: 0.1px; }
.q-n { color: var(--red); font-size: 13px; font-weight: 600; margin-right: 8px; letter-spacing: 1.1px; }
.opts { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 640px) { .opts { grid-template-columns: 1fr 1fr; } }
.opts-tf { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; border: 0; background: var(--bg); padding: 16px; font: 400 15px/1.45 var(--f); color: var(--fg); transition: background .15s; min-width: 0; min-height: 56px; }
.opt:not(:disabled):hover { background: var(--surface-2); }
.opt-letter { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border: 1px solid var(--line-strong); font: 600 11px var(--f); letter-spacing: 0.5px; color: var(--fg-2); }
.opt-ic { margin-left: auto; flex-shrink: 0; }
.opt-correct { background: var(--ok-bg); box-shadow: inset 2px 0 0 var(--success); }
.opt-correct .opt-letter { background: var(--success); border-color: var(--success); color: #fff; }
.opt-correct .opt-ic { color: var(--success); }
.opt-bad { background: var(--no-bg); box-shadow: inset 2px 0 0 var(--warn); }
.opt-bad .opt-letter { background: var(--warn); border-color: var(--warn); color: #fff; }
.opt-bad .opt-ic { color: var(--warn); }
.opt-dim { opacity: 0.4; }
.fb { overflow: hidden; }
.fb-inner { padding: var(--xs) 0 0; font-size: 15px; color: var(--fg-2); max-width: 72ch; }
.fb-inner strong { font-weight: 600; text-transform: uppercase; letter-spacing: 1.1px; font-size: 11px; margin-right: 6px; }
.fb-ok .fb-inner strong { color: var(--success); }
.fb-no .fb-inner strong { color: var(--warn); }
.fb-why { display: block; margin-bottom: 6px; color: var(--fg); }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 60; right: var(--xs); bottom: calc(var(--xs) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--xxs); align-items: flex-end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--fg); padding: 12px 16px; border-left: 2px solid var(--fg); font: 500 14px var(--f); max-width: 320px; }
.toast-xp { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.toast-combo { display: inline-flex; align-items: center; gap: 4px; background: var(--red); color: #fff; padding: 3px 10px; border-radius: 9999px; font: 600 11px var(--f); letter-spacing: 1.1px; }
.toast-label { color: var(--fg-2); }
.toast-miss { border-left-color: var(--warn); }

/* ---------- section 1: machine ---------- */
.machine { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 760px) { .machine { grid-template-columns: 1fr 1.2fr 0.8fr; } }
.mcol { display: flex; flex-direction: column; gap: var(--xxs); padding: var(--xs); background: var(--surface-2); min-width: 0; }
.mcol-h { font: 600 11px var(--f); color: var(--fg-2); letter-spacing: 1.1px; margin-bottom: 4px; }
.node { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line-strong); background: var(--bg); padding: 12px 14px; transition: border-color .2s, background .2s; }
.node-sm { padding: 9px 12px; }
.node-dashed { border-style: dashed; }
.node:hover { border-color: var(--fg-2); }
.node-on { border-color: var(--fg); background: var(--surface); }
.node-rel { border-color: var(--red); }
.node-ic { color: var(--fg-2); display: inline-grid; }
.node-on .node-ic { color: var(--fg); }
.node-txt { display: flex; flex-direction: column; min-width: 0; }
.node-label { font: 500 16px var(--f); }
.node-tag { font-size: 12px; color: var(--fg-2); }
.flow { display: flex; align-items: center; gap: 10px; padding-left: 24px; height: 28px; }
.flow-line { width: 1px; height: 100%; background: repeating-linear-gradient(to bottom, var(--fg-2) 0 4px, transparent 4px 8px); background-size: 1px 8px; animation: flowdown 0.8s linear infinite; }
@keyframes flowdown { to { background-position: 0 8px; } }
.flow-label { font: 600 10px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
.divider-note { text-align: center; font: 600 10px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); border-top: 1px dashed var(--line-strong); padding-top: 8px; margin-top: 2px; }
.machine-detail { min-height: 96px; }
.machine-detail h4 { font-size: 26px; margin-bottom: 6px; }
.machine-detail p { color: var(--fg-2); }
.rels { list-style: none; padding: 0; margin: var(--xs) 0 0; display: flex; flex-direction: column; }
.rels li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; padding: 8px 0; border-top: 1px solid var(--line); }
.rels svg { color: var(--red); flex-shrink: 0; position: relative; top: 2px; }

/* confidence sim */
.sim-intro { color: var(--fg-2); }
.sim-grid { display: grid; gap: var(--md); grid-template-columns: 1fr; align-items: center; }
@media (min-width: 760px) { .sim-grid { grid-template-columns: 1.25fr 1fr; } }
.sim-hemi { display: flex; flex-direction: column; align-items: center; gap: var(--xs); min-width: 0; }
.maj-row { display: flex; justify-content: space-between; width: 100%; max-width: 380px; font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); gap: 6px; }
.maj-row b { color: var(--fg); font-size: 16px; margin-right: 4px; }
.slider-wrap { display: flex; flex-direction: column; gap: var(--xxs); width: 100%; max-width: 380px; }
.slider-wrap .small { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: linear-gradient(to right, var(--fg) var(--p), var(--line-strong) var(--p)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--fg); border: 0; cursor: grab; }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 0; background: var(--fg); border: 0; cursor: grab; }
.sim-status { display: flex; flex-direction: column; gap: var(--xs); }
.status { padding: var(--sm); display: flex; flex-direction: column; gap: var(--xxs); border-top: 2px solid; background: var(--bg); color: var(--fg-2); }
.status-ok { border-color: var(--fg); }
.status-no { border-color: var(--red); }
.status-h { font: 500 32px/1.15 var(--f); letter-spacing: -0.36px; color: var(--fg); }
.status-no .status-h { color: var(--red); }
.ministers { display: flex; flex-wrap: wrap; gap: 6px; min-height: 68px; align-items: flex-start; margin-top: var(--xxs); }
.minister { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line-strong); font: 600 10px var(--f); letter-spacing: 0.5px; color: var(--fg); }
.minister.cm { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ---------- section 2 ---------- */
.venn-wrap { display: grid; gap: var(--md); grid-template-columns: 1fr; align-items: center; }
@media (min-width: 760px) { .venn-wrap { grid-template-columns: 1.15fr 1fr; } }
.venn { width: 100%; height: auto; max-width: 520px; }
.vz { cursor: pointer; }
.vz circle, .vz path { transition: fill-opacity .2s, stroke-width .2s; }
.vz:hover circle, .vz:hover path { fill-opacity: 0.28; }
.vz-on circle, .vz-on path { fill-opacity: 0.34; stroke-width: 4; }
.vz:focus-visible { outline: none; }
.vz:focus-visible circle, .vz:focus-visible path { stroke-width: 5; }
.vt { font: 600 24px var(--f); letter-spacing: 2px; }
.vt-sm { font-size: 18px; }
.vs { font: 400 15px var(--f); }
.venn-panel { display: flex; flex-direction: column; gap: var(--xxs); min-width: 0; color: var(--fg-2); }
.venn-panel > div { display: flex; flex-direction: column; gap: var(--xs); align-items: flex-start; }
.vp-who { font: 500 22px/1.3 var(--f); color: var(--fg); }
.tray { display: flex; flex-wrap: wrap; gap: var(--xxs); min-height: 64px; padding: var(--xs); border: 1px dashed var(--line-strong); align-items: center; }
.chip { border: 1px solid var(--line-strong); background: var(--bg); padding: 10px 16px; font: 500 14px var(--f); touch-action: none; user-select: none; position: relative; }
.chip:hover { border-color: var(--fg); }
.chip-sel { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.chip:disabled { opacity: 0.4; }
.buckets { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 640px) { .buckets { grid-template-columns: repeat(3, 1fr); } }
.bucket { display: flex; flex-direction: column; gap: var(--xs); text-align: left; min-height: 132px; border: 0; border-top: 2px solid var(--c); background: var(--bg); padding: var(--xs); transition: background .2s; }
.bucket-ready { background: var(--surface-2); }
.bucket-ready:hover { background: var(--surface); }
.bucket-h { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--c); }
.bucket-items { display: flex; flex-wrap: wrap; gap: 6px; }
.sort-msg { padding: var(--xs) 0 0; font-size: 15px; color: var(--fg-2); border-top: 1px solid var(--line); }
.sort-msg.ok::before { content: "Correct · "; color: var(--success); font-weight: 600; }
.sort-msg.no::before { content: "Not quite · "; color: var(--warn); font-weight: 600; }
.arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--xs); align-items: center; padding: var(--xs) 0; }
.law { display: flex; flex-direction: column; gap: 4px; padding: var(--xs); border: 1px solid; background: var(--bg); transition: opacity .4s; min-width: 0; font: 500 20px var(--f); }
.law .small { font-size: 12px; font-weight: 400; }
.law-state { border-color: var(--state); }
.law-union { border-color: var(--union); }
.law-h { font: 600 11px var(--f); letter-spacing: 1.1px; }
.law-state .law-h { color: var(--state); }
.law-union .law-h { color: var(--union); }
.law-lose { opacity: 0.3; }
.law-win { border-color: var(--fg); border-width: 2px; }
.vs-badge { font: 600 11px var(--f); letter-spacing: 1.1px; color: var(--fg-2); }
.predict { display: flex; flex-direction: column; gap: var(--xs); }
.example-box { border-top: 1px solid var(--line); padding-top: var(--xs); display: flex; flex-direction: column; gap: 6px; color: var(--fg-2); }
.example-box .mono { font: 600 11px var(--f); letter-spacing: 1.1px; color: var(--fg); }

/* ---------- section 3 ---------- */
.mirror-tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--xs); align-items: center; }
.mirror { display: flex; flex-direction: column; }
.mirror-head { display: none; }
.mrow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--xxs) var(--xs); padding: var(--xs) 0; border-bottom: 1px solid var(--line); }
.mfeat { grid-column: 1 / -1; font: 500 16px var(--f); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mfeat .mono { color: var(--fg-2); font-size: 12px; }
.diff-tag { font: 600 10px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--red); border: 1px solid var(--red); padding: 1px 8px; border-radius: 9999px; }
.mu { font-size: 14px; color: var(--fg-2); padding: 8px 10px; border-left: 2px solid var(--union); min-width: 0; }
.ms { font: 400 14px var(--f); text-align: left; border: 1px dashed var(--line-strong); background: transparent; padding: 8px 10px; color: var(--fg); perspective: 400px; min-width: 0; }
.ms.open { border: 0; border-left: 2px solid var(--state); }
.ms span { display: block; }
.ms-cover { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }
@media (min-width: 760px) {
  .mirror-head { display: grid; grid-template-columns: 1fr 1.1fr 1.1fr; gap: var(--xs); padding: 0 0 var(--xxs); border-bottom: 1px solid var(--fg); }
  .mirror-head span { font: 600 11px var(--f); letter-spacing: 1.1px; }
  .mh-u { grid-column: 2; color: var(--union); }
  .mh-s { grid-column: 3; color: var(--state); }
  .mrow { grid-template-columns: 1fr 1.1fr 1.1fr; align-items: center; }
  .mfeat { grid-column: auto; }
}
.memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--xxs); width: 100%; max-width: 720px; margin: 0 auto; }
.mem { aspect-ratio: 1 / 1; max-width: 100%; border: 0; background: none; padding: 0; perspective: 600px; }
@media (min-width: 640px) { .mem { aspect-ratio: 3 / 2; } }
.mem-inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; }
.mem-back, .mem-front { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; }
.mem-back { background: var(--surface); border: 1px solid var(--line-strong); }
.mem-seal { width: 10px; height: 10px; background: var(--line-strong); font-size: 0; }
.mem-front { transform: rotateY(180deg); font: 500 clamp(11px, 2.4vw, 15px)/1.25 var(--f); gap: 6px; border: 1px solid; background: var(--bg); color: var(--fg); }
.mf-u { border-color: var(--union); }
.mf-s { border-color: var(--state); }
.mem-side { font: 600 9px var(--f); text-transform: uppercase; letter-spacing: 1.1px; }
.mf-u .mem-side { color: var(--union); }
.mf-s .mem-side { color: var(--state); }
.mem-done .mem-front { background: var(--surface-2); }
.win { display: flex; flex-wrap: wrap; gap: var(--xs); align-items: center; justify-content: space-between; border-top: 1px solid var(--success); padding-top: var(--xs); }
.win p { font-weight: 500; }

/* ---------- section 4 ---------- */
.chamber-stage { overflow: hidden; }
.chamber-svg { width: 100%; height: auto; max-width: 560px; display: block; margin: 0 auto; }
.ch-t { font: 500 20px var(--f); }
.ch-s { font: 400 13px var(--f); }
.chamber-cap { text-align: center; max-width: 56ch; margin: 0 auto; color: var(--fg-2); }
.tilemap-wrap { overflow-x: auto; }
.tilemap { display: grid; grid-template-columns: repeat(9, minmax(34px, 1fr)); gap: 4px; max-width: 580px; margin: 0 auto; }
.tile { aspect-ratio: 1 / 1; border: 1px solid var(--line-strong); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; transition: background .2s, border-color .2s; min-width: 0; }
.tile:hover { border-color: var(--fg); }
.t-code { font: 600 12px var(--f); letter-spacing: 0.5px; }
.t-name { display: none; font-size: 9px; line-height: 1.1; text-align: center; color: var(--fg-2); }
@media (min-width: 640px) { .t-name { display: block; } }
.t-on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.t-on .t-name { color: var(--muted); }
.t-hit { background: var(--red); border-color: var(--red); color: #fff; }
.t-hit .t-name { color: rgba(255,255,255,.85); }
.t-miss { border: 2px dashed var(--red); color: var(--fg); }
.t-wrong { background: var(--surface); border-color: var(--fg-2); color: var(--fg-2); text-decoration: line-through; }
.t-off { opacity: 0.35; }
.map-legend { text-align: center; margin-top: var(--xs); color: var(--fg-2); display: flex; flex-direction: column; gap: var(--xxs); align-items: center; }
.map-legend .mono { font: 600 10px var(--f); text-transform: uppercase; letter-spacing: 1.1px; }
.legend-row { display: flex; gap: var(--xs); flex-wrap: wrap; justify-content: center; }
.lg { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 6px; }
.lg-hit { background: var(--red); }
.lg-miss { border: 2px dashed var(--red); }
.lg-wrong { background: var(--surface); border: 1px solid var(--fg-2); }
.map-actions { display: flex; flex-direction: column; gap: var(--xs); align-items: flex-start; color: var(--fg-2); }
.photo-note { display: flex; gap: var(--xs); align-items: flex-start; padding: var(--xs) 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--fg-2); }
.photo-note svg { color: var(--fg-2); flex-shrink: 0; margin-top: 3px; }
.cyp-list { margin: 0; padding: 0; list-style: none; counter-reset: cyp; display: flex; flex-direction: column; }
.cyp-item { counter-increment: cyp; display: flex; flex-direction: column; gap: var(--xs); padding: var(--sm) 0; border-top: 1px solid var(--line); }
.cyp-q { font: 500 18px/1.4 var(--f); }
.cyp-q::before { content: counter(cyp, decimal-leading-zero); color: var(--red); font: 600 12px var(--f); letter-spacing: 1.1px; margin-right: 12px; vertical-align: 2px; }
.cyp-a { display: flex; flex-direction: column; gap: var(--xs); padding-left: var(--xs); border-left: 2px solid var(--fg); color: var(--fg-2); }
.cyp-a .mono { font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 1.1px; }

/* ---------- section 5 ---------- */
.roles-grid { display: grid; gap: var(--md); grid-template-columns: 1fr; align-items: center; }
@media (min-width: 760px) { .roles-grid { grid-template-columns: 1.2fr 1fr; } }
.wheel { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1 / 1; margin: 0 auto; }
.wheel-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.spoke { stroke: var(--line-strong); stroke-width: 0.3; }
.spoke-on { stroke: var(--red); stroke-width: 0.6; }
.wheel-hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1 / 1; border: 1px solid var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: clamp(11px, 2.6vw, 14px); line-height: 1.25; background: var(--surface-2); }
.wheel-hub strong { font-weight: 500; }
.wheel-hub .mono { color: var(--fg-2); font-size: 0.8em; }
.wnode { position: absolute; transform: translate(-50%, -50%); width: 30%; padding: 8px 6px; border: 1px solid var(--line-strong); background: var(--bg); font: 500 clamp(10px, 2.3vw, 13px)/1.25 var(--f); transition: border-color .2s, background .2s; }
.wnode.seen { border-color: var(--fg-2); }
.wnode.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.roles-detail h4 { font-size: 26px; margin-bottom: 6px; }
.roles-detail p { color: var(--fg-2); }
.year { display: flex; flex-direction: column; gap: var(--xxs); }
.year-months { display: grid; grid-template-columns: repeat(12, 1fr); font: 600 10px var(--f); letter-spacing: 1.1px; color: var(--fg-2); text-align: center; }
.year-track { position: relative; height: 56px; background: repeating-linear-gradient(90deg, var(--surface-2) 0 calc(100% / 12 - 1px), var(--line-strong) calc(100% / 12 - 1px) calc(100% / 12)); }
.sess { position: absolute; top: 8px; bottom: 8px; border: 1px solid var(--fg-2); background: var(--bg); font: 600 11px var(--f); text-transform: uppercase; letter-spacing: 0.8px; overflow: hidden; padding: 0 4px; transition: background .2s; }
.sess.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.sess span { white-space: nowrap; }
.sess-detail { display: flex; flex-direction: column; gap: var(--xs); color: var(--fg-2); }
.clock-row { display: flex; gap: var(--sm); align-items: center; flex-wrap: wrap; color: var(--fg-2); }
.clock-row p { flex: 1; min-width: 220px; }
.clock { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
.clock svg { width: 100%; height: 100%; }
.clock-n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: var(--fg); }
.clock-n b { font: 700 26px var(--f); letter-spacing: -0.5px; }
.clock-n small { font: 600 10px var(--f); text-transform: uppercase; letter-spacing: 1.1px; color: var(--fg-2); }

/* ---------- section 6 ---------- */
.cboard { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 640px) { .cboard { grid-template-columns: 1fr 1fr; align-items: stretch; } }
.cgroup { background: var(--bg); overflow: hidden; }
.cgroup.on { background: var(--surface-2); }
.cgroup-h { width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: var(--xs); font: 500 18px var(--f); text-align: left; }
.cgroup-h .mono { font: 600 11px var(--f); color: var(--red); letter-spacing: 1.1px; }
.cgroup-list { list-style: none; margin: 0; padding: 0 var(--xs) var(--xs); display: flex; flex-direction: column; gap: var(--xxs); overflow: hidden; }
.cgroup-list li { display: flex; gap: 10px; font-size: 14px; color: var(--fg-2); }
.cgroup-list svg { color: var(--red); flex-shrink: 0; margin-top: 4px; }
.cboard-note { grid-column: 1 / -1; background: var(--bg); padding: var(--xxs) var(--xs); }
.toggles { display: grid; gap: 1px; grid-template-columns: 1fr; background: var(--line); border: 1px solid var(--line); }
@media (min-width: 560px) { .toggles { grid-template-columns: 1fr 1fr; } }

t subject, the central law prevails, so it applies across India (except certain specific institutions).",wrong:{0:"The RTE Act was enacted by Parliament, not a state.",1:"The chapter's reason is about Parliament's law prevailing, not a Governor's signature.",3:"The chapter places Education on the Concurrent List, not the Union List."}}],s3:[{id:"s3q1",q:"How is the Governor chosen?",opts:["Elected by an electoral college","Appointed by the President","Elected by MLAs","Chosen by the CM"],a:1,why:"The Governor is appointed by the President. (The President, by contrast, is elected by an electoral college.)",wrong:{0:"That's how the President is chosen \u2014 not the Governor.",2:"MLAs choose no Governor; the CM comes from the majority in the Vidhan Sabha.",3:"The CM selects the Council of Ministers, not the Governor."}},{id:"s3q2",q:"In a state, Money Bills can originate only in\u2026",opts:["Vidhan Parishad","Vidhan Sabha","High Court","Rajya Sabha"],a:1,why:"Just as Money Bills originate only in the Lok Sabha at the Union level, in a state they originate only in the Vidhan Sabha.",wrong:{0:"The Vidhan Parishad is the upper house \u2014 Money Bills start in the lower house.",2:"Courts don't introduce Bills.",3:"Rajya Sabha is a Union house, and Money Bills don't originate there either."}},{id:"s3q3",type:"tf",q:"True or false: The Union legislature can be unicameral.",a:!1,why:"False. Parliament is always bicameral (Lok Sabha + Rajya Sabha). It's state legislatures that can be unicameral or bicameral."}],s4:[{id:"s4q1",q:"A bicameral state legislature has\u2026",opts:["Only the Vidhan Sabha","Vidhan Sabha and Vidhan Parishad","Lok Sabha and Rajya Sabha","Vidhan Sabha and the High Court"],a:1,why:"Bicameral = two houses: Vidhan Sabha (Legislative Assembly) and Vidhan Parishad (Legislative Council).",wrong:{0:"Only one house = unicameral.",2:"Those are the two houses of Parliament, not a state.",3:"The High Court is the judiciary, not a house of the legislature."}},{id:"s4q2",q:"Which of these states has a UNICAMERAL legislature?",opts:["Bihar","Karnataka","Kerala","Telangana"],a:2,why:"Kerala is not one of the six bicameral states (AP, Bihar, Karnataka, Maharashtra, Telangana, UP), so it is unicameral.",wrong:{0:"Bihar is one of the six bicameral states.",1:"Karnataka is one of the six bicameral states.",3:"Telangana is one of the six bicameral states."}}],s5:[{id:"s5q1",q:"How many main sessions does Parliament hold each year?",opts:["Two","Three","Four","Twelve"],a:1,why:"Three: the Budget Session, the Monsoon Session and the Winter Session.",wrong:{0:"There are three \u2014 Budget, Monsoon and Winter.",2:"There are three, not four.",3:"Parliament meets in three sessions, not monthly."}},{id:"s5q2",q:"About how long does Parliament usually sit each day during a session?",opts:["2 hours","About 6 hours","12 hours","24 hours"],a:1,why:"About six hours a day \u2014 extendable on special occasions or when urgent business must be completed.",wrong:{0:"It's about six hours a day.",2:"Usually about six hours, not twelve.",3:"Usually about six hours a day."}}],s6:[{id:"s6q1",q:"What does the chapter say these challenges lead to?",opts:["Faster decisions and more laws","Delay in decision-making, low productivity and reduced effectiveness","More sittings each year","Stronger committees"],a:1,why:"The challenges lead to delay in decision-making, low productivity and reduced effectiveness in carrying out duties.",wrong:{0:"The opposite \u2014 decisions get delayed.",2:"A low number of sittings is itself listed as a challenge.",3:"Inadequate use of committees is listed as a challenge."}},{id:"s6q2",type:"tf",q:"True or false: Criminalisation of politics means many legislators have criminal cases against them.",a:!0,why:"True \u2014 that's exactly how the chapter describes criminalisation of politics."}],s7:[{id:"s7q1",q:"Which full-term Lok Sabha had the fewest sitting days?",opts:["13th","15th","16th","17th"],a:3,why:"The 17th Lok Sabha (2019\u20132024) had only 274 sitting days \u2014 the fewest among all full-term Lok Sabhas.",wrong:{0:"The 13th had 356 \u2014 joint highest in the table.",1:"The 15th had 332.",2:"The 16th had 331."}},{id:"s7q2",q:"Average annual sitting days of Lok Sabha fell from ___ (1952\u201370) to ___ (since 2000).",opts:["121 \u2192 68","71 \u2192 55","356 \u2192 274","100 \u2192 50"],a:0,why:"Annual average fell from 121 days during 1952\u201370 to 68 days since 2000.",wrong:{1:"71 \u2192 55 is the 13th vs 17th Lok Sabha comparison.",2:"356 \u2192 274 are total sitting days (13th vs 17th), not annual averages.",3:"The chapter's figures are 121 and 68."}}],s8:[{id:"s8q1",q:"According to the chapter, what happens when legislators fail to perform their duties responsibly?",opts:["People trust institutions more","Citizens feel their voices are not heard and welfare is neglected","Elections are cancelled","Media stops reporting"],a:1,why:"It creates disappointment, reduces trust in democratic institutions, and makes citizens feel unheard and that public welfare is neglected.",wrong:{0:"Trust goes down, not up.",2:"The chapter says nothing about elections being cancelled.",3:"The media actually raises these concerns."}},{id:"s8q2",type:"tf",q:"True or false: Cartoons using humour and satire to criticise legislators are a common feature of healthy democracies.",a:!0,why:"True. The chapter says expressing concerns through cartoons with humour and satire is a common feature of healthy democracies."}]},Sa=[{id:"f1",front:"State Legislature",back:"The lawmaking body at the state level."},{id:"f2",front:"Vidhan Sabha",back:"Legislative Assembly \u2014 the name of the State Legislature (lower house) in most states."},{id:"f3",front:"MLA",back:"Member of Legislative Assembly \u2014 a member of the Vidhan Sabha."},{id:"f4",front:"Vidhan Parishad",back:"Legislative Council \u2014 the upper house; exists only in some states."},{id:"f5",front:"Nominal head of the state",back:"The Governor \u2014 appointed by the President."},{id:"f6",front:"Real executive power in a state",back:"The Council of Ministers, headed by the Chief Minister."},{id:"f7",front:"Collective responsibility",back:"The CM and Council of Ministers are together responsible to the Legislative Assembly and must resign if they lose the confidence of the majority of MLAs."},{id:"f8",front:"7th Schedule",back:"Part of the Constitution containing the Union, State and Concurrent Lists, which distribute lawmaking powers."},{id:"f9",front:"Union List",back:"National importance: Defence, Foreign Affairs, Railways, Banking, Atomic Energy, Citizenship, Currency."},{id:"f10",front:"State List",back:"Local & regional importance: Agriculture, Police, Public Health, Local Government."},{id:"f11",front:"Concurrent List",back:"Both Union and States can make laws: Education, Marriage & divorce, Adoption, Forests, Criminal Laws."},{id:"f12",front:"Conflict on a Concurrent subject",back:"The law made by Parliament (central law) prevails."},{id:"f13",front:"RTE Act, 2009",back:"Enacted by Parliament; applies across India (except certain specific institutions) though Education is on the Concurrent List."},{id:"f14",front:"Unicameral",back:"Legislature with one house \u2014 Vidhan Sabha only."},{id:"f15",front:"Bicameral",back:"Legislature with two houses \u2014 Vidhan Sabha and Vidhan Parishad."},{id:"f16",front:"The six bicameral states",back:"Andhra Pradesh, Bihar, Karnataka, Maharashtra, Telangana, Uttar Pradesh."},{id:"f17",front:"How is the CM selected?",back:"Leader of the majority party or coalition in the Vidhan Sabha."},{id:"f18",front:"State Budget",back:"Presented by the State Finance Minister. Money Bills originate only in the Vidhan Sabha."},{id:"f19",front:"Sessions of Parliament",back:"Three a year: Budget, Monsoon and Winter. About six hours of sitting a day."},{id:"f20",front:"Lok Sabha sitting days: then vs now",back:"Annual average fell from 121 days (1952\u201370) to 68 days (since 2000)."},{id:"f21",front:"17th Lok Sabha (2019\u201324)",back:"274 sitting days, ~55 a year \u2014 the fewest among all full-term Lok Sabhas."},{id:"f22",front:"Effects of legislative challenges",back:"Delay in decision-making, low productivity and reduced effectiveness; reduced public trust."},{id:"f23",front:"Role of media",back:"Raises public concerns through debates, cartoons, journals, articles and social media \u2014 often with humour and satire."}],Ne={definitions:[["State Legislature","The lawmaking body at the state level; called the Legislative Assembly (Vidhan Sabha) in most states."],["Nominal head","The formal head of the executive without real power \u2014 the Governor at the state level."],["Real executive","The Council of Ministers headed by the Chief Minister, which holds the real executive power."],["Collective responsibility","The CM and the Council of Ministers are together responsible to the Legislative Assembly and must resign if they lose the majority's confidence."],["Unicameral legislature","A legislature with only one house (Vidhan Sabha)."],["Bicameral legislature","A legislature with two houses (Vidhan Sabha and Vidhan Parishad)."],["Sessions of Parliament","The meetings of Parliament \u2014 Budget, Monsoon and Winter \u2014 made up of sittings where Bills and national issues are discussed and the government's work is reviewed."]],facts:["The 7th Schedule contains three lists: Union, State and Concurrent.","On a Concurrent List conflict, Parliament's law prevails.","Governor: appointed by the President; term 5 years.","CM: leader of the majority party/coalition in the Vidhan Sabha; selects the Council of Ministers.","Only six states are bicameral: AP, Bihar, Karnataka, Maharashtra, Telangana, UP.","Money Bills in a state originate only in the Vidhan Sabha.","State-level judiciary: High Courts.","Parliament: 3 sessions a year, about 6 hours a sitting day.","Lok Sabha sitting days: 121/year (1952\u201370) \u2192 68/year (since 2000).","17th Lok Sabha: 274 sitting days, the fewest of all full-term Lok Sabhas."],differences:[{title:"Governor vs Chief Minister",cols:["Governor","Chief Minister"],rows:[["Nominal head of the state executive","Real head of the state government"],["Appointed by the President","Leader of majority party/coalition in Vidhan Sabha"],["Does not head the Council of Ministers","Heads the Council of Ministers and selects it"]]},{title:"Unicameral vs Bicameral",cols:["Unicameral","Bicameral"],rows:[["One house","Two houses"],["Vidhan Sabha only","Vidhan Sabha + Vidhan Parishad"],["Most states","Only six states currently"]]},{title:"President vs Governor",cols:["President","Governor"],rows:[["Nominal head of the Union","Nominal head of the state"],["Elected by an electoral college","Appointed by the President"],["Term: 5 years","Term: 5 years"]]}],causeEffect:[["Loss of majority's confidence","CM and Council of Ministers must resign"],["State law clashes with central law (Concurrent List)","Central law prevails"],["Personal attacks and sloganeering","Poor-quality debates"],["Inadequate use of committees","Lower quality of legislative review"],["Money and lobbying","Focus shifts away from public welfare"],["Legislators fail in their duties","Disappointment and reduced public trust in democratic institutions"]],short:[{id:"ex1",q:"What are the three lists in the 7th Schedule? Give one example of each.",a:"Union List (e.g. Defence), State List (e.g. Police) and Concurrent List (e.g. Education). They distribute lawmaking powers between the Union and the State governments."},{id:"ex2",q:"What happens if a state law conflicts with a central law on a Concurrent List subject? Give an example.",a:"The law made by Parliament (central law) prevails. For example, the RTE Act, 2009, enacted by Parliament, applies across the whole of India (except certain specific institutions) even though Education is on the Concurrent List."},{id:"ex3",q:"Differentiate between a unicameral and a bicameral state legislature.",a:"A unicameral legislature has only one house, the Vidhan Sabha. A bicameral legislature has two houses, the Vidhan Sabha and the Vidhan Parishad. Only six states \u2014 Andhra Pradesh, Bihar, Karnataka, Maharashtra, Telangana and Uttar Pradesh \u2014 are bicameral."},{id:"ex4",q:"Name the three sessions of Parliament.",a:"The Budget Session, the Monsoon Session and the Winter Session. Parliament usually sits about six hours a day during these sessions."}],long:[{id:"ex5",q:"Describe the structure and functioning of the state executive.",a:"The executive implements laws and runs the state government. The Governor, appointed by the President, is the nominal head of the state executive. The real executive power is held by the Council of Ministers headed by the Chief Minister. The CM is the leader of the majority party or coalition in the Vidhan Sabha and selects the Council of Ministers. The CM and the Council of Ministers are collectively responsible to the Legislative Assembly, which means they must resign if they lose the confidence of the majority of MLAs."},{id:"ex6",q:"Explain any five challenges to the effective functioning of legislatures in India.",a:"(1) Many legislators remain absent during sessions. (2) Frequent disruptions in the form of protests and walkouts. (3) Personal attacks and sloganeering lead to poor-quality debates. (4) Insufficient scrutiny of Bills \u2014 many are passed without detailed discussion. (5) Influence of money and lobbying shifts focus away from public welfare. Others: low number of sittings, criminalisation of politics, interruptions during Question Hour, inadequate use of committees. These lead to delay in decision-making, low productivity and reduced effectiveness."},{id:"ex7",q:"Compare the structure of the Union government and the State government.",a:"The structures are parallel. Parliament is the Union legislature; the State Legislature is the state's. Parliament is bicameral (Lok Sabha, Rajya Sabha); a state legislature may be unicameral (Vidhan Sabha) or bicameral (Vidhan Sabha, Vidhan Parishad). The President (elected by an electoral college) is the Union's nominal head; the Governor (appointed by the President) is the state's. The PM and the CM are the real heads, each the leader of the majority in the lower house, and each selects the Council of Ministers. Money Bills originate only in the Lok Sabha / Vidhan Sabha. The Supreme Court is the Union judiciary; High Courts are at state level. Elections to both are held every 5 years."}],reasoning:[{id:"ex8",q:"Give reason: The Governor is called the nominal head of the state.",a:"Because although the Governor is the official head of the state executive, the real executive power is held by the Council of Ministers headed by the Chief Minister."},{id:"ex9",q:"Give reason: The Concurrent List shows the interdependent nature of federalism.",a:"Because matters on it, like education and environmental policy, require collaboration between the Union and the States \u2014 both can make laws on them."},{id:"ex10",q:"Give reason: Challenges in legislatures reduce people's trust in democracy.",a:"Because when legislators fail to perform their duties responsibly, citizens feel their voices are not heard and public welfare is neglected, causing disappointment."}],data:[{id:"ex11",q:"From the table (13th\u201317th Lok Sabha), which Lok Sabha had the maximum and minimum sitting days?",a:"Maximum: the 13th and 14th Lok Sabhas, 356 days each (~71 a year). Minimum: the 17th Lok Sabha, 274 days (55 a year)."}]},Md=[{id:"fc1",type:"mcq",q:"MLAs are members of which house?",opts:["Lok Sabha","Rajya Sabha","Vidhan Sabha","Vidhan Parishad only"],a:2,teach:"MLA = Member of Legislative Assembly. The Legislative Assembly is the Vidhan Sabha."},{id:"fc2",type:"sort",q:"Tap each subject, then tap its list.",items:[["Railways","Union"],["Police","State"],["Marriage & Divorce","Concurrent"],["Atomic Energy","Union"],["Public Health","State"],["Criminal Laws","Concurrent"]],teach:"Union = national importance (Railways, Atomic Energy). State = local/regional (Police, Public Health). Concurrent = both can legislate (Marriage & divorce, Criminal Laws)."},{id:"fc3",type:"tf",q:"The Governor of a state is elected by an electoral college.",a:!1,teach:"The President is elected by an electoral college. The Governor is APPOINTED by the President."},{id:"fc4",type:"sequence",q:"Put the steps in order \u2014 from election to a working state government.",items:["State Legislative Assembly elections are held","A party or coalition wins the majority in the Vidhan Sabha","Its leader becomes the Chief Minister","The CM selects the Council of Ministers","The Council stays in office only while it has the confidence of the majority of MLAs"],teach:"Elections \u2192 majority in Vidhan Sabha \u2192 its leader becomes CM \u2192 CM selects Council of Ministers \u2192 collective responsibility to the Assembly."},{id:"fc5",type:"mcq",q:"The state government loses the confidence of the majority of MLAs. What must happen?",opts:["The Governor resigns","Only the CM resigns","The CM and the Council of Ministers resign","The High Court takes over"],a:2,teach:"Collective responsibility: the CM and Council of Ministers are responsible together to the Legislative Assembly, so they resign together."},{id:"fc6",type:"match",q:"Match each Union post or body to its state twin.",pairs:[["Prime Minister","Chief Minister"],["Rajya Sabha","Vidhan Parishad"],["Supreme Court","High Courts"],["Lok Sabha","Vidhan Sabha"]],teach:"PM \u2194 CM, Rajya Sabha \u2194 Vidhan Parishad, Supreme Court \u2194 High Courts, Lok Sabha \u2194 Vidhan Sabha."},{id:"fc7",type:"mcq",q:"Which of these is NOT a bicameral state?",opts:["Maharashtra","Uttar Pradesh","West Bengal","Andhra Pradesh"],a:2,teach:"The six bicameral states: Andhra Pradesh, Bihar, Karnataka, Maharashtra, Telangana, Uttar Pradesh. West Bengal isn't on the list."},{id:"fc8",type:"mcq",q:"The RTE Act, 2009 applies across India because\u2026",opts:["Education is on the State List","It was enacted by Parliament and central law prevails on Concurrent subjects","Every Governor signed it","The High Courts ordered it"],a:1,teach:"Education is a Concurrent subject. Parliament enacted the RTE Act, and on a conflict the central law prevails."},{id:"fc9",type:"tf",q:"In a state, Money Bills can originate in the Vidhan Parishad.",a:!1,teach:"Money Bills originate only in the Vidhan Sabha (just as at the Union level they originate only in the Lok Sabha)."},{id:"fc10",type:"mcq",q:"Which session is NOT one of Parliament's three main sessions?",opts:["Budget Session","Summer Session","Monsoon Session","Winter Session"],a:1,teach:"The three sessions are Budget, Monsoon and Winter. There's no 'Summer Session' in the chapter."},{id:"fc11",type:"mcq",q:"'Many Bills are passed without detailed discussion.' Which challenge is this?",opts:["Criminalisation of politics","Insufficient scrutiny of Bills","Influence of lobbying","Absent legislators"],a:1,teach:"Insufficient scrutiny of Bills = passing Bills without detailed discussion."},{id:"fc12",type:"mcq",q:"The 17th Lok Sabha had 274 sitting days. The 13th had 356. How many fewer did the 17th have?",opts:["72","82","92","25"],a:1,teach:"356 \u2212 274 = 82 fewer sitting days."},{id:"fc13",type:"tf",q:"Personal attacks and sloganeering lead to poor-quality debates.",a:!0,teach:"Yes \u2014 the chapter links personal attacks and sloganeering directly to poor-quality debates."},{id:"fc14",type:"mcq",q:"A cartoon jokes that the Monsoon Session brings 'thunder, lightning, storms'. What is it doing?",opts:["Reporting the weather","Using satire to criticise disruptions in Parliament","Advertising a holiday","Explaining the Budget"],a:1,teach:"Media raises public concerns through cartoons with humour and satire \u2014 a common feature of healthy democracies."}];var x=F(ne()),wi={Union:"var(--union)",State:"var(--state)",Concurrent:"var(--conc)"};functi
